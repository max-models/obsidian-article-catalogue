[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-article-catalogue"
dynamic = ["version"]
description = "Generate an article catalogue for obsidian from your .bib file."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["obsidian", "article", "catalogue", "bib", "latex"]
authors = [{name = "Max"}]
classifiers = [
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "pillow",
    "platformdirs",
    "pybtex>=0.25",
    "pylatexenc>=2.10,<3",
    "pymupdf>=1.24.3",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "ruff"]

[project.urls]
"Source" = "https://github.com/max-models/obsidian-article-catalogue"

[project.scripts]
obscat = "obscat.cli:main"

[tool.setuptools.dynamic]
version = {attr = "obscat.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings on Python 3.12+.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
